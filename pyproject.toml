[project]
name = "llm-code-generation-benchmark"
version = "0.1.0"
description = "A Streamlit benchmark for comparing repository-aware code generation from Aya Expanse and Llama 4 Scout."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deepeval>=3.0.0",
    "gitingest>=0.1.4",
    "ipykernel>=6.29.5",
    "litellm>=1.71.1",
    "pandas>=2.2.3",
    "plotly>=6.1.2",
    "python-dotenv>=1.1.0",
    "streamlit>=1.45.1",
]
