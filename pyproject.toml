[project]
name = "llm-code-generation-benchmark"
version = "0.1.0"
description = "A repository-aware benchmark for comparing LLM code generation with deterministic checks and DeepEval."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deepeval>=3.0.0",
    "gitingest>=0.1.4",
    "ipykernel>=6.29.5",
    "litellm>=1.71.1",
    "openai>=1.0.0",
    "pandas>=2.2.3",
    "plotly>=6.1.2",
    "pytest>=8.0.0",
    "python-dotenv>=1.1.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]
