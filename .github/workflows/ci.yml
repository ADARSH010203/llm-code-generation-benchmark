name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile project files
        run: python -m compileall -q app.py code_ingestion.py code_validation.py code_evaluation.py model_service.py

      - name: Run deterministic tests
        run: pytest -q tests
